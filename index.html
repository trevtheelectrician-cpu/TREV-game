<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Princess Heart Chase V3 - Fixed</title>
<style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030d;color:#fff;font-family:monospace}body{display:flex;align-items:center;justify-content:center}#w{width:min(100vw,560px);padding:7px}#hud{display:flex;justify-content:space-between;padding:5px;color:#ffd75e;font-weight:bold;font-size:12px}canvas{width:100%;display:block;border:4px solid #d8a83e;background:#100b25;image-rendering:pixelated;touch-action:none}#tip{text-align:center;font-size:11px;padding:5px;opacity:.82}</style></head><body><div id="w"><div id="hud"><span>♥ PRINCESS HEART CHASE ♥</span><span id="score"></span></div><canvas id="g" width="450" height="570"></canvas><div id="tip">Swipe ↑ ↓ ← → • portals teleport only the Princess</div></div>
<script>(()=>{"use strict";const C=document.getElementById("g"),X=C.getContext("2d"),S=document.getElementById("score"),T=30,R=19,K=15,MAZES=[["###############", "#.....#.#.....#", "#.###.#.#.###.#", "#.............#", "#.###.#.#.###.#", "#.....#.#.....#", "###.#.....#.###", "#...#.###.#...#", "#.#.........#.#", "#.#.###.###.#.#", "#.............#", "#.###.#.#.###.#", "#.....#.#.....#", "###.#.....#.###", "#...#.###.#...#", "#.#.........#.#", "#.###.#.#.###.#", "#.............#", "###############"], ["###############", "#.............#", "#.###.###.###.#", "#.#.........#.#", "#.#.#.###.#.#.#", "#...#.....#...#", "###.###.###.###", "#.............#", "#.###.#.#.###.#", "#.....#.#.....#", "#.###.....###.#", "#...#.###.#...#", "#.#.........#.#", "#.#.###.###.#.#", "#.............#", "#.###.#.#.###.#", "#.....#.#.....#", "#.............#", "###############"], ["###############", "#.....#.#.....#", "#.###.#.#.###.#", "#.............#", "###.#.###.#.###", "#...#.....#...#", "#.#.###.###.#.#", "#.#.........#.#", "#...#.###.#...#", "###.#.....#.###", "#.............#", "#.###.#.#.###.#", "#.....#.#.....#", "#.###.....###.#", "#...#.###.#...#", "#.#.........#.#", "#.###.#.#.###.#", "#.............#", "###############"], ["###############", "#.............#", "#.###.#.#.###.#", "#.....#.#.....#", "###.#.....#.###", "#...#.###.#...#", "#.#.........#.#", "#.#.###.###.#.#", "#.............#", "#.###.#.#.###.#", "#.....#.#.....#", "#.###.....###.#", "#...#.###.#...#", "###.#.....#.###", "#.............#", "#.###.#.#.###.#", "#.....#.#.....#", "#.............#", "###############"], ["###############", "#.....#.#.....#", "#.###.#.#.###.#", "#.............#", "#.#.###.###.#.#", "#.#.........#.#", "#...#.###.#...#", "###.#.....#.###", "#.............#", "#.###.#.#.###.#", "#.....#.#.....#", "#.###.....###.#", "#...#.###.#...#", "#.#.........#.#", "###.#.###.#.###", "#.............#", "#.###.#.#.###.#", "#.............#", "###############"]];
const SONGS=[[262,330,392,523,392,330],[294,370,440,587,440,370],[330,415,494,659,494,415],[349,440,523,698,523,440],[392,494,587,784,587,494]],INTRO=[392,494,587,659,587,494,440,523],WED=[523,659,784,1047,880,1047,1319,1047];
let lev=0,M,P,Q,H=[],ports=[],score=0,state="intro",last=0,lastH=0,lastN=0,audio=null,sx=0,sy=0,lock=0,intro0=0,win0=0;
const free=(x,y)=>x>=0&&x<K&&y>=0&&y<R&&M[y][x]!=="#";
function cells(){let a=[];for(let y=1;y<R-1;y++)for(let x=1;x<K-1;x++)if(free(x,y))a.push([x,y]);return a}
function setup(n){lev=n;M=MAZES[n];let a=cells(),u,v;do{u=a[Math.random()*a.length|0];v=a[Math.random()*a.length|0]}while(Math.abs(u[0]-v[0])+Math.abs(u[1]-v[1])<9);ports=[u,v];P={c:1,r:1,x:45,y:45,dx:0,dy:0,wx:0,wy:0,sp:126};let e=a[a.length-1];Q={c:e[0],r:e[1],x:e[0]*T+15,y:e[1]*T+15,dx:0,dy:0,sp:62};H=[];score=0;lastH=0;lock=0;S.textContent=`LEVEL ${n+1} • HEARTS 0`}
function rect(x,y,w,h,c){X.fillStyle=c;X.fillRect(x|0,y|0,w,h)}
function wall(x,y){rect(x+2,y+2,26,26,"#38235f");rect(x+5,y+5,20,20,"#7652a4");rect(x+8,y+8,14,14,"#24183f");rect(x+5,y+5,20,3,"#b88be0")}
function world(){rect(0,0,450,570,"#0e0920");for(let r=0;r<R;r++)for(let q=0;q<K;q++)if(M[r][q]==="#")wall(q*T,r*T);else rect(q*T+14,r*T+14,2,2,"#56436d");ports.forEach((p,i)=>{let x=p[0]*T+15,y=p[1]*T+15;X.strokeStyle=i?"#ff62e5":"#725cff";X.lineWidth=4;X.beginPath();X.arc(x,y,10,0,Math.PI*2);X.stroke()})}
function heart(h){rect(h.x-6,h.y-4,6,6,"#ff3157");rect(h.x,h.y-4,6,6,"#ff3157");rect(h.x-6,h.y+1,12,5,"#ff3157");rect(h.x-3,h.y+6,6,4,"#ff3157")}
function princess(x,y,s=1){X.save();X.translate(x,y);X.scale(s,s);rect(-11,7,22,9,"#e64e9b");rect(-14,14,28,5,"#ff77b8");rect(-8,-12,16,16,"#f2bd91");rect(-10,-16,20,6,"#d85618");rect(-11,-11,4,17,"#d85618");rect(7,-11,4,17,"#d85618");rect(-9,-20,18,4,"#ffd84c");rect(-2,-27,4,8,"#ffd84c");X.restore()}
function prince(x,y,s=1){X.save();X.translate(x,y);X.scale(s,s);rect(-10,5,20,12,"#29417f");rect(-7,-11,14,15,"#d9a47e");rect(-10,-16,20,7,"#17131d");rect(-11,-11,4,12,"#17131d");rect(7,-11,4,12,"#17131d");rect(-4,7,8,6,"#ff3157");rect(-8,-20,16,3,"#ffd84c");X.restore()}
const ctr=o=>Math.abs(o.x-(o.c*T+15))<6&&Math.abs(o.y-(o.r*T+15))<6;
function upP(dt,now){if(ctr(P)){P.x=P.c*T+15;P.y=P.r*T+15;if(free(P.c+P.wx,P.r+P.wy)){P.dx=P.wx;P.dy=P.wy}if(!free(P.c+P.dx,P.r+P.dy))P.dx=P.dy=0;if(now>lock)for(let i=0;i<2;i++)if(P.c===ports[i][0]&&P.r===ports[i][1]){let d=ports[1-i];P.c=d[0];P.r=d[1];P.x=P.c*T+15;P.y=P.r*T+15;lock=now+700;beep(900,.1,.025);break}if(P.dx||P.dy){P.c+=P.dx;P.r+=P.dy}}P.x+=P.dx*P.sp*dt;P.y+=P.dy*P.sp*dt}
function chooseQ(){let ds=[[1,0],[-1,0],[0,1],[0,-1]],o=ds.filter(d=>free(Q.c+d[0],Q.r+d[1])&&!(d[0]===-Q.dx&&d[1]===-Q.dy));if(!o.length)o=ds.filter(d=>free(Q.c+d[0],Q.r+d[1]));if(o.length){o.sort((a,b)=>(Math.abs(Q.c+b[0]-P.c)+Math.abs(Q.r+b[1]-P.r))-(Math.abs(Q.c+a[0]-P.c)+Math.abs(Q.r+a[1]-P.r)));let d=Math.random()<.55?o[0]:o[Math.random()*o.length|0];Q.dx=d[0];Q.dy=d[1]}}
function upQ(dt){if(ctr(Q)){Q.x=Q.c*T+15;Q.y=Q.r*T+15;chooseQ();if(Q.dx||Q.dy){Q.c+=Q.dx;Q.r+=Q.dy}}Q.x+=Q.dx*Q.sp*dt;Q.y+=Q.dy*Q.sp*dt}
function emit(now){if(now-lastH>1800){H.push({x:Q.x-Q.dx*14,y:Q.y-Q.dy*14,life:23});lastH=now}}
function collect(dt,now){for(let i=H.length-1;i>=0;i--){H[i].life-=dt;if(Math.hypot(H[i].x-P.x,H[i].y-P.y)<19){H.splice(i,1);score++;S.textContent=`LEVEL ${lev+1} • HEARTS ${score}`;beep(760,.05,.025)}else if(H[i].life<=0)H.splice(i,1)}if(Math.hypot(P.x-Q.x,P.y-Q.y)<23){beep(523,.12,.04);if(lev<4){state="between";setTimeout(()=>{setup(lev+1);state="play"},1300)}else{state="win";win0=now}}}
function beep(f,d,v){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}
function sound(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume()}
function tune(now,a,pace=.25,vol=.008){if(audio&&now-lastN>pace*1000){beep(a[Math.floor(now/(pace*1000))%a.length],.12,vol);lastN=now}}
function overlay(a,b){rect(45,235,360,100,"#0c081e");X.strokeStyle="#d8a83e";X.strokeRect(45,235,360,100);X.textAlign="center";X.fillStyle="#ffd85b";X.font="bold 21px monospace";X.fillText(a,225,275);X.fillStyle="#fff";X.font="13px monospace";X.fillText(b,225,306)}
function intro(now){rect(0,0,450,570,"#100b25");for(let y=0;y<570;y+=60)for(let x=0;x<450;x+=60)wall(x,y);rect(40,78,370,400,"#17102c");X.textAlign="center";X.fillStyle="#ffd85b";X.font="bold 23px monospace";X.fillText("PRINCESS HEART CHASE",225,125);princess(145,225,2);prince(330,220,1.1);X.fillStyle="#fff";X.font="14px monospace";X.fillText("The Princess is searching",225,300);X.fillText("the castle for her Prince…",225,322);let rules=["SWIPE to guide the Princess","COLLECT the Prince's red hearts","USE the two magic teleport portals","CATCH the Prince to clear each maze","COMPLETE all 5 castles for the wedding"];let n=Math.floor((now-intro0)/2200)%rules.length;X.fillStyle="#e8ddff";X.font="12px monospace";X.fillText("♥ "+rules[n]+" ♥",225,385);X.fillStyle="#ffd85b";X.font="bold 15px monospace";X.fillText("TOUCH TO BEGIN",225,445);tune(now,INTRO,.32,.009)}
function win(now){rect(0,0,450,570,"#12091f");for(let i=0;i<20;i++){let a=now/700+i,r=65+(i%6)*35;rect(225+Math.cos(a+i)*r,250+Math.sin(a+i)*r,4,4,i%2?"#ffd85b":"#ff6aaa")}X.textAlign="center";X.fillStyle="#ffd85b";X.font="bold 24px monospace";X.fillText("♥ HAPPILY EVER AFTER ♥",225,95);X.fillStyle="#fff";X.font="14px monospace";X.fillText("The Princess found her Prince!",225,130);princess(190,290,2);prince(258,290,2);X.fillStyle="#ff3157";X.font="34px serif";X.fillText("♥",225,255);X.strokeStyle="#ffd84c";X.lineWidth=7;X.beginPath();X.arc(225,180,20,0,Math.PI*2);X.stroke();X.fillStyle="#eaf8ff";X.beginPath();X.moveTo(225,147);X.lineTo(214,164);X.lineTo(236,164);X.closePath();X.fill();X.fillStyle="#ffd85b";X.font="bold 19px monospace";X.fillText("ROYAL WEDDING!",225,390);X.fillStyle="#fff";X.font="13px monospace";X.fillText("Five castles conquered • Love wins!",225,420);X.fillStyle="#ffd85b";X.fillText("TOUCH TO PLAY AGAIN",225,485);tune(now,WED,.23,.018)}
function dir(dx,dy){if(Math.abs(dx)>Math.abs(dy)){P.wx=dx>0?1:-1;P.wy=0}else{P.wx=0;P.wy=dy>0?1:-1}}
function beginInput(x,y){sound();sx=x;sy=y;if(state==="intro"){setup(0);state="play";lastN=0;return}if(state==="win"){state="intro";intro0=performance.now();lastN=0;return}}
function moveInput(x,y){if(state!=="play")return;let dx=x-sx,dy=y-sy;if(Math.abs(dx)>10||Math.abs(dy)>10){dir(dx,dy);sx=x;sy=y}}
C.addEventListener("touchstart",e=>{e.preventDefault();let p=e.touches[0];beginInput(p.clientX,p.clientY)},{passive:false});
C.addEventListener("touchmove",e=>{e.preventDefault();let p=e.touches[0];moveInput(p.clientX,p.clientY)},{passive:false});
C.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch"){e.preventDefault();beginInput(e.clientX,e.clientY);C.setPointerCapture?.(e.pointerId)}},{passive:false});
C.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")moveInput(e.clientX,e.clientY)},{passive:false});
window.addEventListener("keydown",e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();sound();P.wx=d[0];P.wy=d[1]}});
function frame(now){let dt=Math.min(.035,(now-last)/1000||0);last=now;if(!intro0)intro0=now;if(state==="intro"){intro(now);requestAnimationFrame(frame);return}if(state==="win"){win(now);requestAnimationFrame(frame);return}if(state==="play"){upP(dt,now);upQ(dt);emit(now);collect(dt,now);tune(now,SONGS[lev],.25,.008)}world();H.forEach(heart);prince(Q.x,Q.y);princess(P.x,P.y);if(state==="between")overlay("LEVEL COMPLETE!",`Entering Castle Maze ${lev+2}`);requestAnimationFrame(frame)}
setup(0);state="intro";requestAnimationFrame(frame)})();</script></body></html>
